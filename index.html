<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Vault Graph</title>
<style>
  :root {
    --page-plane:     #050507;
    --surface-1:      #07070b;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    /* derived from --text-muted, not a literal color - a translucent WHITE
       divider reads fine on a dark theme but disappears entirely against a
       light one. color-mix() re-evaluates live whenever --text-muted
       changes (every theme switch), no per-theme value needed. */
    --border:         color-mix(in srgb, var(--text-muted) 22%, transparent);
    --other:          #6b6a65;

    --series-1: #3987e5; /* blue    */
    --series-2: #d95926; /* orange  */
    --series-3: #199e70; /* aqua    */
    --series-4: #c98500; /* yellow  */
    --series-5: #d55181; /* magenta */
    --series-6: #008300; /* green   */
    --series-7: #9085e9; /* violet  */
    --series-8: #e66767; /* red     */

    --activity-read:  #2dd4bf; /* muted teal - read pulse */
    --activity-write: #f0a830; /* warm gold - write flash/ring */

    /* deliberately NOT part of the theme picker below - read/write are a
       functional signal, not decoration, and letting them drift into an
       arbitrary palette (e.g. green-on-green) would make them hard to tell
       apart. Still just plain vars, easy to hand-tune directly. */
    --bg-gradient-center: #0c0c17;
    --bg-gradient-edge:   #020203;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--page-plane);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  #graph { display: block; width: 100vw; height: 100vh; background: var(--surface-1); cursor: grab; }

  #legend {
    position: fixed; top: 14px; left: 14px;
    /* derived from --surface-1, not a hardcoded dark color - it used to
       stay dark even on a light theme, leaving light-theme text unreadable
       against it. Tracks whatever the current theme's surface actually is. */
    background: color-mix(in srgb, var(--surface-1) 82%, transparent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    max-width: 260px;
    transition: transform 180ms ease;
  }
  #legend.collapsed {
    transform: translateX(calc(-100% + 24px));
    background: none;
    border: 0;
    box-shadow: none;
    outline: 0;
  }
  #legend.collapsed > :not(#legend-toggle) {
    visibility: hidden;
  }
  #legend-toggle {
    position: absolute;
    top: 7px;
    right: 6px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font: inherit;
    line-height: 18px;
  }
  #legend-toggle:hover {
    background: var(--border);
    color: var(--text-primary);
  }

  #legend-menu {
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin: 1px 0;
    padding: 4px 4px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    text-align: left;
  }
  .menu-row:hover {
    background: var(--border);
    color: var(--text-primary);
  }
  .menu-icon {
    flex: none;
    width: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 11px;
  }
  .menu-row:hover .menu-icon { color: var(--text-primary); }
  .menu-icon svg { width: 14px; height: 14px; stroke: currentColor; }
  #labels-toggle .menu-icon { font-size: 9px; }
  .menu-label { flex: 1; }
  .menu-state { flex: none; color: var(--text-muted); font-size: 11px; }
  .theme-row { cursor: default; }
  .theme-row:hover { background: transparent; }
  .menu-select {
    flex: none;
    max-width: 120px;
    background: transparent;
    border: 0;
    color: var(--text-muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .menu-select:hover, .menu-select:focus { color: var(--text-primary); }
  .menu-select option { background: var(--surface-1); color: var(--text-primary); }
  .section-label {
    margin: 0 0 4px;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #legend h1 {
    font-size: 12px; font-weight: 600; margin: 0 24px 8px 0;
    color: var(--text-primary); letter-spacing: 0.02em;
  }
  #legend .row {
    display: flex; align-items: center; gap: 8px; margin: 1px 0;
    padding: 3px 4px; border-radius: 4px; cursor: pointer;
  }
  #legend .row:hover { background: var(--border); }
  #legend .row.folder-active { background: var(--border); }
  #legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #legend .row span.name { color: var(--text-secondary); }
  #legend .row.folder-active span.name { color: var(--text-primary); }
  #legend .meta { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--text-muted); }

  #tooltip {
    position: fixed; pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-primary);
    display: none;
    max-width: 280px;
  }
  #tooltip .folder { color: var(--text-muted); font-size: 11px; }

  /* Folder inspector: click a legend row to fly the camera to that folder's
     cluster and pop this panel open with its notes. Mirrors the legend's own
     translucent-panel look, on the opposite (now-free) corner. */
  #folder-panel {
    position: fixed; top: 14px; right: 14px;
    width: 260px; max-height: calc(100vh - 28px);
    overflow-y: auto;
    /* same fix as #legend above - tracks the current theme's surface */
    background: color-mix(in srgb, var(--surface-1) 85%, transparent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }
  #folder-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  #folder-panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #folder-panel-title {
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #folder-panel-close {
    flex: none; width: 18px; height: 18px; padding: 0;
    border: 0; border-radius: 4px; background: transparent;
    color: var(--text-muted); cursor: pointer; font: inherit; font-size: 14px; line-height: 18px;
  }
  #folder-panel-close:hover { background: var(--border); color: var(--text-primary); }
  #folder-panel-meta {
    margin: 4px 0 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); color: var(--text-muted);
  }
  .folder-note-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 3px 4px; margin: 1px 0; border-radius: 4px; cursor: pointer;
  }
  .folder-note-row:hover { background: var(--border); }
  .folder-note-label {
    color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .folder-note-row:hover .folder-note-label { color: var(--text-primary); }
  .folder-note-right { flex: none; display: flex; align-items: center; gap: 6px; }
  .folder-note-meta { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
  .folder-note-obsidian {
    display: flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; color: var(--text-muted);
  }
  .folder-note-obsidian:hover { color: var(--text-primary); }
  .folder-note-obsidian svg { width: 12px; height: 12px; stroke: currentColor; }
</style>
</head>
<body>
<canvas id="graph"></canvas>
<div id="legend">
  <button id="legend-toggle" type="button" aria-label="Collapse menu" aria-expanded="true">‹</button>
  <h1>VAULT GRAPH — live</h1>
  <div id="legend-menu">
    <button class="menu-row" id="sound-toggle" type="button" aria-label="Mute activity sounds" aria-pressed="false">
      <span class="menu-icon"></span><span class="menu-label">Sound</span><span class="menu-state">On</span>
    </button>
    <button class="menu-row" id="labels-toggle" type="button" aria-label="Hide note labels" aria-pressed="false">
      <span class="menu-icon">Aa</span><span class="menu-label">Labels</span><span class="menu-state">On</span>
    </button>
    <div class="menu-row theme-row">
      <span class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg></span>
      <span class="menu-label">Theme</span>
      <select id="theme-select" class="menu-select" aria-label="Color theme"></select>
    </div>
  </div>
  <div class="section-label">Folders</div>
  <div id="legend-rows"></div>
  <div class="meta" id="legend-meta">loading…</div>
</div>
<div id="tooltip"></div>
<div id="folder-panel">
  <div id="folder-panel-header">
    <span id="folder-panel-title"></span>
    <button id="folder-panel-close" type="button" aria-label="Close folder panel">×</button>
  </div>
  <div id="folder-panel-meta"></div>
  <div id="folder-panel-notes"></div>
</div>

<script>
// mutable (not const): a theme switch re-reads all of these from the DOM's
// current --custom-properties, since the canvas below only ever bakes in
// literal color values at draw time rather than reading CSS live itself -
// see refreshThemeColors()/applyTheme() further down.
let PALETTE = [];
let OTHER_COLOR, GRIDLINE, TEXT_SECONDARY, TEXT_MUTED, TEXT_PRIMARY;

// read/write pulse colors are deliberately NOT part of the theme picker -
// see the --activity-read/--activity-write comment in <style> - so these
// stay const, read once like before.
const ACTIVITY_READ_COLOR = getVar('--activity-read');
const ACTIVITY_WRITE_COLOR = getVar('--activity-write');

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function refreshThemeColors() {
  PALETTE = [
    getVar('--series-1'), getVar('--series-2'), getVar('--series-3'), getVar('--series-4'),
    getVar('--series-5'), getVar('--series-6'), getVar('--series-7'), getVar('--series-8'),
  ];
  OTHER_COLOR = getVar('--other');
  GRIDLINE = getVar('--gridline');
  TEXT_SECONDARY = getVar('--text-secondary');
  TEXT_MUTED = getVar('--text-muted');
  TEXT_PRIMARY = getVar('--text-primary');
  buildBgGradient();
}

const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const legend = document.getElementById('legend');
const folderPanel = document.getElementById('folder-panel');
const legendToggle = document.getElementById('legend-toggle');
const labelsToggle = document.getElementById('labels-toggle');
const soundToggle = document.getElementById('sound-toggle');

legendToggle.addEventListener('click', () => {
  const collapsed = legend.classList.toggle('collapsed');
  legendToggle.textContent = collapsed ? '›' : '‹';
  legendToggle.setAttribute('aria-label', collapsed ? 'Expand menu' : 'Collapse menu');
  legendToggle.setAttribute('aria-expanded', String(!collapsed));
});

// delegated (not per-row) since renderLegend() fully rebuilds #legend-rows'
// children on every /api/graph poll — a listener on the row itself would
// need re-binding every 2s, one on the stable parent survives that for free
document.getElementById('legend-rows').addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  focusFolder(row.dataset.folder);
  document.querySelectorAll('#legend-rows .row').forEach(r => {
    r.classList.toggle('folder-active', r.dataset.folder === folderFocusId);
  });
});

document.getElementById('folder-panel-notes').addEventListener('click', (e) => {
  if (e.target.closest('a')) return; // let the obsidian:// link handle its own click
  const row = e.target.closest('.folder-note-row');
  if (!row) return;
  focusId = row.dataset.id === focusId ? null : row.dataset.id;
});

document.getElementById('folder-panel-close').addEventListener('click', closeFolderPanel);

// on-canvas note-title labels (hub/focused/hovered notes) — persisted across
// reloads so the choice sticks; this is a local single-user page, not a
// published artifact, so plain localStorage applies with no special handling
let labelsVisible = true;
try {
  const stored = localStorage.getItem('vault-graph-labels-visible');
  if (stored !== null) labelsVisible = stored === 'true';
} catch (e) {
  // private window / storage blocked — fall back to the default (visible)
}

function updateLabelsToggle() {
  labelsToggle.querySelector('.menu-state').textContent = labelsVisible ? 'On' : 'Off';
  labelsToggle.setAttribute('aria-pressed', String(!labelsVisible));
  labelsToggle.setAttribute('aria-label', labelsVisible ? 'Hide note labels' : 'Show note labels');
}
updateLabelsToggle();

labelsToggle.addEventListener('click', () => {
  labelsVisible = !labelsVisible;
  try { localStorage.setItem('vault-graph-labels-visible', String(labelsVisible)); } catch (e) {}
  updateLabelsToggle();
});

// activity sound: soft tones on read/write events, same persisted-toggle
// pattern as labelsVisible above. Defaults on; the click that mutes/unmutes
// also doubles as the user gesture browsers require before audio can play.
let soundEnabled = true;
try {
  const storedSound = localStorage.getItem('vault-graph-sound-enabled');
  if (storedSound !== null) soundEnabled = storedSound === 'true';
} catch (e) {
  // private window / storage blocked — fall back to the default (on)
}

// Thin-line icons (stroke only, currentColor) to match the Aa labels
// glyph's fine-lined look instead of a colorful bitmap emoji.
const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
  '<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>' +
  '<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>' +
  '<line x1="23" y1="9" x2="17" y2="15"></line>' +
  '<line x1="17" y1="9" x2="23" y2="15"></line></svg>';

function updateSoundToggle() {
  soundToggle.querySelector('.menu-icon').innerHTML = soundEnabled ? ICON_SOUND_ON : ICON_SOUND_OFF;
  soundToggle.querySelector('.menu-state').textContent = soundEnabled ? 'On' : 'Off';
  soundToggle.setAttribute('aria-pressed', String(!soundEnabled));
  soundToggle.setAttribute('aria-label', soundEnabled ? 'Mute activity sounds' : 'Unmute activity sounds');
}
updateSoundToggle();

soundToggle.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('vault-graph-sound-enabled', String(soundEnabled)); } catch (e) {}
  updateSoundToggle();
  ensureAudioCtx();  // this click is a user gesture — use it to unlock audio early
});

// Soft radial gradient instead of a flat fill, so the sky reads with a
// little depth (a faint glow toward center, deepening toward the edges)
// rather than a single uniform black plane. Rebuilt on resize (canvas
// dimensions changed) and on every theme switch (colors changed) - not
// per frame, both are cheap, infrequent events.
let bgGradient;
function buildBgGradient() {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(cx, cy));
  bgGradient.addColorStop(0, getVar('--bg-gradient-center'));
  bgGradient.addColorStop(1, getVar('--bg-gradient-edge'));
}
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  buildBgGradient();
}
window.addEventListener('resize', resize);
resize();

const THEME_STORAGE_KEY = 'vault-graph-theme';
let currentTheme = 'Default';

function applyTheme(name) {
  currentTheme = THEMES[name] ? name : 'Default';
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries(THEMES[currentTheme])) {
    root.setProperty('--' + k, v);
  }
  refreshThemeColors();
  const select = document.getElementById('theme-select');
  if (select && select.value !== currentTheme) select.value = currentTheme;
  try { localStorage.setItem(THEME_STORAGE_KEY, currentTheme); } catch (e) {}
}

function initThemeSelect() {
  const select = document.getElementById('theme-select');
  for (const key of Object.keys(THEMES)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = THEME_LABELS[key] || key;
    select.appendChild(opt);
  }
  select.addEventListener('change', () => applyTheme(select.value));

  let stored = 'Default';
  try {
    const s = localStorage.getItem(THEME_STORAGE_KEY);
    if (s && THEMES[s]) stored = s;
  } catch (e) {
    // private window / storage blocked - fall back to Default
  }
  applyTheme(stored);
}
initThemeSelect();

function edgeKey(a, b) {
  // JSON.stringify of a sorted pair, not a joined string — filenames could
  // theoretically contain any plain separator character (e.g. "|"), and this
  // representation can't collide the way string-joining could.
  return JSON.stringify([a, b].sort());
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
const READ_RGB = hexToRgb(ACTIVITY_READ_COLOR);
const WRITE_RGB = hexToRgb(ACTIVITY_WRITE_COLOR);

// theme-aware replacement for a literal white: whatever actually reads as
// "brightest, most legible" against the current theme's own background -
// near-white on a dark theme, near-black on a light one - since --text-primary
// is exactly that signal already, chosen by each theme for contrast against
// its own surface. Used for glows/highlights/stars that want to read as
// maximally salient regardless of theme, not a specific literal color.
function rgbaText(alpha) {
  const [r, g, b] = hexToRgb(TEXT_PRIMARY);
  return `rgba(${r},${g},${b},${alpha})`;
}

// legend rows are fully rebuilt by renderLegend() on every /api/graph poll,
// so a one-time inline style would just get wiped — this re-applies the
// current decayed glow every frame instead, querying live DOM each time
// rather than caching row references, so it survives the periodic rebuild.
function updateLegendGlow() {
  const now = Date.now();
  document.querySelectorAll('#legend-rows .row').forEach(row => {
    const folder = row.dataset.folder;
    const act = folderActivity.get(folder);
    if (!act) { row.style.boxShadow = ''; return; }
    const tau = act.action === 'write' ? EDGE_WRITE_TAU_MS : EDGE_READ_TAU_MS;
    const elapsed = now - act.lastUpdate;
    act.intensity *= Math.exp(-elapsed / tau);
    act.lastUpdate = now;
    if (act.intensity < 0.02) {
      folderActivity.delete(folder);
      row.style.boxShadow = '';
      return;
    }
    const t = Math.min(1, act.intensity);
    const [cr, cg, cb] = act.action === 'write' ? WRITE_RGB : READ_RGB;
    row.style.boxShadow = `0 0 ${(5 + 9 * t).toFixed(1)}px rgba(${cr},${cg},${cb},${(0.25 + 0.55 * t).toFixed(2)})`;
  });
}

// ---- orbit camera: drag rotates the whole system around the fixed anchor, wheel dollies in/out ----
const camera = { yaw: 0, pitch: 0.35, dist: 420 };

// Folder-inspector camera tracking (drag/wheel orbit above is user-driven
// and untouched). Rather than a one-shot animation to a target computed
// once at click time, this recomputes the ideal yaw/pitch/dist from LIVE
// node positions every frame and eases camera.* toward it a little each
// tick. That matters because a newly-focused folder's nodes may still be
// mid-flight from their initial spawn-shell positions (see applyGraph's
// "spawn on a shell around the origin" comment) toward wherever gravity
// actually settles them - a one-shot target locked in from that transient,
// not-yet-clustered snapshot looked like a wrong, zoomed-way-out camera
// that never corrected itself. Continuous tracking self-corrects as the
// simulation converges instead of freezing on a bad first guess. Any
// manual drag or scroll stops tracking rather than fighting it - see the
// mousedown/wheel listeners below.
let folderTracking = false;

function folderCameraTarget(key) {
  const notes = notesForFolderKey(key);
  if (!notes.length) return null;
  let cx = 0, cy = 0, cz = 0;
  notes.forEach(n => { cx += n.x; cy += n.y; cz += n.z; });
  cx /= notes.length; cy /= notes.length; cz /= notes.length;
  let maxR = 0;
  notes.forEach(n => { maxR = Math.max(maxR, Math.hypot(n.x - cx, n.y - cy, n.z - cz)); });
  return {
    // solve for the yaw/pitch that puts (cx,cy,cz) on-axis under project()'s
    // own yaw-then-pitch rotation, so the cluster centers on screen
    yaw: Math.atan2(-cx, cz),
    pitch: Math.min(1.4, Math.max(-1.4, Math.atan2(cy, Math.hypot(cx, cz)))),
    dist: Math.min(900, Math.max(150, maxR * 2.6 + 120)),
  };
}

function updateFolderTracking() {
  if (!folderTracking || !folderFocusId) return;
  const target = folderCameraTarget(folderFocusId);
  if (!target) return;
  // shortest angular path, so tracking never spins the long way around
  let dyaw = target.yaw - camera.yaw;
  dyaw = ((dyaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  const k = 0.08; // per-frame follow rate — gentle, not an instant snap
  camera.yaw += dyaw * k;
  camera.pitch += (target.pitch - camera.pitch) * k;
  camera.dist += (target.dist - camera.dist) * k;
}
const FOCAL = 420;

function project(node) {
  const cosY = Math.cos(camera.yaw), sinY = Math.sin(camera.yaw);
  const x1 = node.x * cosY + node.z * sinY;
  const z1 = -node.x * sinY + node.z * cosY;

  const cosP = Math.cos(camera.pitch), sinP = Math.sin(camera.pitch);
  const y2 = node.y * cosP - z1 * sinP;
  const z2 = node.y * sinP + z1 * cosP;

  const depth = Math.max(40, z2 + camera.dist);
  const factor = FOCAL / depth;
  return {
    sx: canvas.width / 2 + x1 * factor,
    sy: canvas.height / 2 + y2 * factor,
    depth, factor,
  };
}

let projected = [];  // [{node, sx, sy, sr, depth, factor}], recomputed once per frame, shared by drawing + hit-testing

// ---- starfield backdrop (fixed to viewport, doesn't move with the camera) ----
// Real starlight scintillation is small, irregular, and has no visible shape
// to it - not a big rhythmic pulse. Each star has a steady baseline
// brightness of its own, with two small independent-frequency wobbles
// layered on top (rather than one large sine) so the flicker reads as
// irregular, plus a barely-perceptible sway so the field isn't dead-static.
const STARS = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.2 + 0.3,
  baseAlpha: 0.35 + Math.random() * 0.35,
  seed1: Math.random() * 1000,
  seed2: Math.random() * 1000,
  freq1: 0.0006 + Math.random() * 0.0007,
  freq2: 0.004 + Math.random() * 0.006,
  swayAmp: 0.15 + Math.random() * 0.35,
  swayFreq: 0.00012 + Math.random() * 0.00018,
  swayPhaseX: Math.random() * Math.PI * 2,
  swayPhaseY: Math.random() * Math.PI * 2,
}));
function drawStarfield() {
  const now = Date.now();
  for (const s of STARS) {
    const sx = s.x * canvas.width + Math.sin(now * s.swayFreq + s.swayPhaseX) * s.swayAmp;
    const sy = s.y * canvas.height + Math.cos(now * s.swayFreq * 0.8 + s.swayPhaseY) * s.swayAmp;

    const flicker = 0.08 * Math.sin(now * s.freq1 + s.seed1) + 0.05 * Math.sin(now * s.freq2 + s.seed2);
    const alpha = Math.max(0.15, Math.min(1, s.baseAlpha + flicker));

    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = rgbaText(alpha);
    ctx.fill();
  }
}

function colorForSlot(slot) {
  return slot >= 0 && slot < PALETTE.length ? PALETTE[slot] : OTHER_COLOR;
}

async function poll() {
  try {
    const res = await fetch('/api/graph');
    const data = await res.json();
    applyGraph(data);
  } catch (e) {
    // server between restarts, etc — just try again next tick
  }
  setTimeout(poll, 2000);
}

// ---- activity feed: your coding agent's hooks report reads/writes here.
// Polled separately from /api/graph (faster, cursor-based on event id) so a
// note can react within a few hundred ms. Per-node intensities decay by
// elapsed wall-clock time, not frame count, so playback stays consistent
// regardless of frame rate.
// Tuned 2026-08-31 after live observation: on a real desktop, most notes are
// low-degree with a tiny base radius, so an overlay purely proportional to
// that radius was only ~8-12px across and nearly imperceptible even when
// told exactly when to look. Every overlay below now has an absolute pixel
// floor independent of node size, plus longer hold times and higher peak
// opacity, verified by reading actual canvas pixel data, not screenshots.
const READ_TAU_MS = 900;          // read glow decay time constant
const READ_BOOST = 0.6, READ_MAX = 1.6;
const READ_MIN_PX = 18;           // floor screen radius for the read glow
const WRITE_FLASH_TAU_MS = 350;   // still faster than read (a flash, not a glow) but no longer gone in a blink
const WRITE_FLASH_BOOST = 1.0, WRITE_FLASH_MAX = 2.2;
const WRITE_FLASH_MIN_PX = 24;    // floor screen radius for the write flash — bigger than read's, reads as "stronger"
const WRITE_RING_DURATION_MS = 1600;
const WRITE_RING_START_GAP_PX = 5;  // ring starts this far outside the node edge so it reads as a ring, not paint-on-top, even at t=0
const WRITE_RING_GROWTH = 40;     // px the ring expands beyond its start gap over its lifetime
const WRITE_RING_MAX_PER_NODE = 6;

// Phase 3 (2026-08-31): a touched note's existing wikilink edges, and its
// folder's legend row, get a derived echo of the same read/write signal —
// shared timing model for both, separate from the primary node constants
// above. Edges are thin (1px) lines, even more prone to the "too subtle"
// problem the node tuning pass just fixed, so these lean toward longer/
// stronger rather than matching the node values exactly.
const EDGE_READ_TAU_MS = 900, EDGE_READ_BOOST = 0.6, EDGE_READ_MAX = 1.6;
const EDGE_WRITE_TAU_MS = 1400, EDGE_WRITE_BOOST = 1.0, EDGE_WRITE_MAX = 2.0;
const PENDING_EVENT_TTL_MS = 5000;  // how long an event for an unknown path is held before being dropped

// activity sound: a wind chime, per 2026-09-02 call. Synthesized attempts
// (sine partials at inharmonic bell ratios) topped out sounding like a
// struck pot rather than a chime — real metal-on-metal texture is past what
// pure tones can fake — so this plays back a real recorded strike instead,
// varying its pitch via playback rate. That has a useful side effect for
// free: speeding it up also shortens the ring, slowing it down lengthens
// it, which is exactly how a shorter/longer tube actually behaves. Read
// plays faster/brighter/shorter, write slower/deeper/longer — same
// distinguishable-by-ear split as before, same no-throttling stance (an
// overlapping burst during a run of vault activity IS the gust).
const CHIME_SAMPLE_URL = 'assets/wind-chime-single.wav';
const READ_RATE_MIN = 1.15, READ_RATE_MAX = 1.6;
const WRITE_RATE_MIN = 0.7, WRITE_RATE_MAX = 1.0;
const READ_GAIN = 0.35, WRITE_GAIN = 0.55;
const GAIN_JITTER = 0.15;      // +/- per-strike loudness variance, so repeats don't sound mechanically identical
const CHIME_PAN_SPREAD = 0.8;  // +/- stereo pan range per strike, so a burst spreads across the field like hanging tubes instead of stacking dead-center

let audioCtx = null;
let chimeBufferPromise = null;

function ensureAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
    chimeBufferPromise = fetch(CHIME_SAMPLE_URL)
      .then(res => res.arrayBuffer())
      .then(buf => audioCtx.decodeAudioData(buf))
      .catch(() => null);  // sample missing/blocked — playActivityTone just no-ops
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playActivityTone(action) {
  if (!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx || ctx.state !== 'running' || !chimeBufferPromise) return;  // still locked pending a user gesture
  chimeBufferPromise.then(buffer => {
    if (!buffer || !soundEnabled) return;
    const isWrite = action === 'write';
    const rateMin = isWrite ? WRITE_RATE_MIN : READ_RATE_MIN;
    const rateMax = isWrite ? WRITE_RATE_MAX : READ_RATE_MAX;
    const baseGain = isWrite ? WRITE_GAIN : READ_GAIN;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = rateMin + Math.random() * (rateMax - rateMin);

    const gain = ctx.createGain();
    gain.gain.value = baseGain * (1 - GAIN_JITTER + Math.random() * GAIN_JITTER * 2);

    const pan = ctx.createStereoPanner();
    pan.pan.value = (Math.random() * 2 - 1) * CHIME_PAN_SPREAD;

    src.connect(gain).connect(pan).connect(ctx.destination);
    src.start();
  });
}

// Active-note label timing (2026-08-31): deliberately decoupled from the node's
// own readIntensity/writeFlash decay above. The node flash/ring stay fast and
// energetic; the label instead holds fully readable for a fixed window, then
// fades on its own separate schedule, refreshed by each new event rather than
// tracking pulse intensity directly.
const LABEL_HOLD_MS = 8000;
const LABEL_FADE_MS = 600;

async function pollActivity() {
  try {
    const res = await fetch(`/api/activity?since=${activityCursor}`);
    const data = await res.json();
    for (const ev of data.events) {
      if (ev.id > activityCursor) activityCursor = ev.id;
      applyActivityEvent(ev);
    }
  } catch (e) {
    // server between restarts, etc — just try again next tick
  }
  setTimeout(pollActivity, 450);
}

function applyActivityEvent(ev) {
  const node = nodesById.get(ev.path);
  if (!node) {
    // note not in the currently-known graph yet (e.g. a brand-new note read/
    // written right after creation, racing the next /api/graph poll) — hold
    // briefly instead of dropping, replayed from applyGraph() once it lands
    pendingActivity.push({ ev, receivedAt: Date.now() });
    return;
  }
  applyActivityToNode(node, ev);
}

function applyActivityToNode(node, ev) {
  const now = Date.now();
  playActivityTone(ev.action);
  if (ev.action === 'read') {
    node.readIntensity = Math.min(READ_MAX, (node.readIntensity || 0) + READ_BOOST);
    node.readLastUpdate = now;
  } else if (ev.action === 'write') {
    node.writeFlash = Math.min(WRITE_FLASH_MAX, (node.writeFlash || 0) + WRITE_FLASH_BOOST);
    node.writeFlashLastUpdate = now;
    const rings = node.writeRings || (node.writeRings = []);
    rings.push({ start: now });
    if (rings.length > WRITE_RING_MAX_PER_NODE) rings.shift();
  }

  // active-note label: independent hold/fade window, refreshed (not stacked)
  // by every event. Write precedence sticks — once a write has shown the
  // label amber, a subsequent read before it fully expires keeps it amber
  // and just extends the hold, rather than downgrading back to blue.
  node.labelAction = ev.action === 'write' ? 'write' : (node.labelAction === 'write' ? 'write' : 'read');
  node.labelExpiresAt = now + LABEL_HOLD_MS;

  // derived echo: this note's existing wikilink edges, and its folder's
  // legend row, get the same read/write signal — a note's edges are computed
  // atomically alongside it server-side, so by the time `node` resolves here
  // (whether immediately or via pending replay) its edges are already current
  const isWrite = ev.action === 'write';
  const edgeCap = isWrite ? EDGE_WRITE_MAX : EDGE_READ_MAX;
  const edgeBoost = isWrite ? EDGE_WRITE_BOOST : EDGE_READ_BOOST;
  for (const e of edges) {
    if (e.source !== node.id && e.target !== node.id) continue;
    const key = edgeKey(e.source, e.target);
    const existing = edgeActivity.get(key);
    edgeActivity.set(key, {
      intensity: Math.min(edgeCap, (existing ? existing.intensity : 0) + edgeBoost),
      lastUpdate: now,
      action: ev.action,
    });
  }

  const folderKey = node.slot === -1 ? 'Other' : node.folder;
  const existingFolder = folderActivity.get(folderKey);
  folderActivity.set(folderKey, {
    intensity: Math.min(edgeCap, (existingFolder ? existingFolder.intensity : 0) + edgeBoost),
    lastUpdate: now,
    action: ev.action,
  });
}

function applyGraph(data) {
  folders = data.folders;
  if (data.vault_name) VAULT_NAME = data.vault_name;
  const incomingIds = new Set(data.nodes.map(n => n.id));

  // drop nodes that no longer exist
  for (const id of Array.from(nodesById.keys())) {
    if (!incomingIds.has(id)) nodesById.delete(id);
  }

  for (const n of data.nodes) {
    const existing = nodesById.get(n.id);
    if (existing) {
      existing.folder = n.folder;
      existing.slot = n.slot;
      existing.mtime = n.mtime;
      existing.degree = n.degree;
      existing.label = n.label;
    } else {
      // spawn on a shell around the origin so new notes drop into the system, not the void
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 180 + Math.random() * 80;
      nodesById.set(n.id, {
        ...n,
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta),
        z: r * Math.cos(phi),
        vx: 0, vy: 0, vz: 0,
      });
    }
  }

  edges = data.edges;

  // drop edge-activity entries for edges that no longer exist (e.g. a
  // wikilink was removed) — otherwise they'd never be visited again by the
  // draw-loop decay, since that loop only walks the current edges array
  const currentEdgeKeys = new Set(edges.map(e => edgeKey(e.source, e.target)));
  for (const key of Array.from(edgeActivity.keys())) {
    if (!currentEdgeKeys.has(key)) edgeActivity.delete(key);
  }

  // replay activity events that arrived before their note existed here yet
  if (pendingActivity.length) {
    const now = Date.now();
    const stillPending = [];
    for (const pending of pendingActivity) {
      if (now - pending.receivedAt > PENDING_EVENT_TTL_MS) continue; // expired — drop
      const node = nodesById.get(pending.ev.path);
      if (node) applyActivityToNode(node, pending.ev);
      else stillPending.push(pending);
    }
    pendingActivity = stillPending;
  }

  // the most-connected note becomes the anchor — pinned dead center, everything else orbits it
  let best = null;
  for (const node of nodesById.values()) {
    if (!best || node.degree > best.degree) best = node;
  }
  anchorId = best ? best.id : null;

  renderLegend(data);
}

function renderLegend(data) {
  const rows = document.getElementById('legend-rows');
  rows.innerHTML = '';
  folders.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (f === folderFocusId ? ' folder-active' : '');
    row.dataset.folder = f;
    row.innerHTML = `<span class="swatch" style="background:${colorForSlot(i)}"></span><span class="name">${f}</span>`;
    rows.appendChild(row);
  });
  const hasOther = data.nodes.some(n => n.slot === -1);
  if (hasOther) {
    const row = document.createElement('div');
    row.className = 'row' + (folderFocusId === 'Other' ? ' folder-active' : '');
    row.dataset.folder = 'Other';
    row.innerHTML = `<span class="swatch" style="background:${OTHER_COLOR}"></span><span class="name">Other</span>`;
    rows.appendChild(row);
  }
  document.getElementById('legend-meta').textContent =
    `${data.nodes.length} notes · ${data.edges.length} links`;
}

// ---- folder inspector: click a legend row to fly the camera to that
// folder's cluster and pop this panel open with its notes ----
function notesForFolderKey(key) {
  const all = Array.from(nodesById.values());
  return key === 'Other' ? all.filter(n => n.slot === -1) : all.filter(n => n.folder === key);
}

// true when no folder is focused (nothing dimmed for this reason) or the
// given node belongs to the currently-focused folder
function inFocusedFolder(node) {
  if (!folderFocusId) return true;
  return folderFocusId === 'Other' ? node.slot === -1 : node.folder === folderFocusId;
}

function focusFolder(key) {
  if (folderFocusId === key) { closeFolderPanel(); return; }
  const notes = notesForFolderKey(key);
  if (!notes.length) return;
  folderFocusId = key;
  folderTracking = true;
  renderFolderPanel(key, notes);
}

function closeFolderPanel() {
  folderFocusId = null;
  folderTracking = false;
  folderPanel.classList.remove('open');
  document.querySelectorAll('#legend-rows .row').forEach(r => r.classList.remove('folder-active'));
}

// obsidian://open needs the vault's registered NAME (see VAULT_NAME) and the
// note's path relative to the vault root, without the .md extension.
function obsidianUrl(noteId) {
  const path = noteId.replace(/\.md$/, '');
  return `obsidian://open?vault=${encodeURIComponent(VAULT_NAME)}&file=${encodeURIComponent(path)}`;
}
const ICON_OBSIDIAN = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>' +
  '<polyline points="15 3 21 3 21 9"></polyline>' +
  '<line x1="10" y1="14" x2="21" y2="3"></line></svg>';

function renderFolderPanel(key, notes) {
  document.getElementById('folder-panel-title').textContent = key;
  document.getElementById('folder-panel-meta').textContent =
    `${notes.length} note${notes.length === 1 ? '' : 's'}`;
  const list = document.getElementById('folder-panel-notes');
  list.innerHTML = '';
  const showFolder = key === 'Other'; // "Other" spans several real folders, so name each one
  [...notes].sort((a, b) => a.label.localeCompare(b.label)).forEach(n => {
    const row = document.createElement('div');
    row.className = 'folder-note-row';
    row.dataset.id = n.id;
    const ago = timeAgo(Date.now() - n.mtime);
    row.innerHTML = `<span class="folder-note-label">${n.label}</span>` +
      `<span class="folder-note-right">` +
        `<span class="folder-note-meta">${showFolder ? n.folder + ' · ' : ''}${ago}</span>` +
        `<a class="folder-note-obsidian" href="${obsidianUrl(n.id)}" title="Open in Obsidian" aria-label="Open ${n.label} in Obsidian">${ICON_OBSIDIAN}</a>` +
      `</span>`;
    list.appendChild(row);
  });
  folderPanel.classList.add('open');
}

// ---- 3D force simulation ----
function step() {
  const nodes = Array.from(nodesById.values());
  const n = nodes.length;

  // repulsion
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
      let distSq = dx * dx + dy * dy + dz * dz || 0.01;
      if (distSq > 40000) continue; // ignore far-apart pairs, cheap cutoff
      const dist = Math.sqrt(distSq);
      const force = 900 / distSq;
      dx /= dist; dy /= dist; dz /= dist;
      a.vx += dx * force; a.vy += dy * force; a.vz += dz * force;
      b.vx -= dx * force; b.vy -= dy * force; b.vz -= dz * force;
    }
  }

  // edge springs
  for (const e of edges) {
    const a = nodesById.get(e.source), b = nodesById.get(e.target);
    if (!a || !b) continue;
    let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.01;
    const rest = 90;
    const force = (dist - rest) * 0.02;
    dx /= dist; dy /= dist; dz /= dist;
    a.vx += dx * force; a.vy += dy * force; a.vz += dz * force;
    b.vx -= dx * force; b.vy -= dy * force; b.vz -= dz * force;
  }

  // weak same-folder clustering (position reinforces the color's identity)
  const centroids = {};
  for (const node of nodes) {
    const c = centroids[node.folder] || (centroids[node.folder] = { x: 0, y: 0, z: 0, n: 0 });
    c.x += node.x; c.y += node.y; c.z += node.z; c.n++;
  }
  for (const node of nodes) {
    const c = centroids[node.folder];
    node.vx += (c.x / c.n - node.x) * 0.003;
    node.vy += (c.y / c.n - node.y) * 0.003;
    node.vz += (c.z / c.n - node.z) * 0.003;
  }

  // real gravity toward the anchor (inverse-square, softened near r=0) + a gentle
  // galactic swirl + drift (keeps it feeling alive even at rest) + damping + integrate
  const GRAVITY = 4500, SOFTEN = 900, SWIRL = 0.035;
  for (const node of nodes) {
    const distSq = node.x * node.x + node.y * node.y + node.z * node.z || 1;
    const dist = Math.sqrt(distSq);
    const g = GRAVITY / (distSq + SOFTEN);
    const nx = node.x / dist, ny = node.y / dist, nz = node.z / dist;
    node.vx += -nx * g;
    node.vy += -ny * g;
    node.vz += -nz * g;

    // tangential nudge around the Y axis so the system slowly spins like a galaxy disc
    node.vx += -nz * SWIRL;
    node.vz += nx * SWIRL;

    node.vx += (Math.random() - 0.5) * 0.05;
    node.vy += (Math.random() - 0.5) * 0.05;
    node.vz += (Math.random() - 0.5) * 0.05;
    node.vx *= 0.86; node.vy *= 0.86; node.vz *= 0.86;
    node.x += node.vx; node.y += node.vy; node.z += node.vz;
  }

  // the anchor is the sun — pinned dead center, immune to every force above
  if (anchorId) {
    const anchor = nodesById.get(anchorId);
    if (anchor) { anchor.x = anchor.y = anchor.z = 0; anchor.vx = anchor.vy = anchor.vz = 0; }
  }
}

function nodeRadius(node) {
  const base = 4 + Math.min(node.degree, 10) * 0.9;
  return node.id === anchorId ? base * 1.8 : base;
}

function computeProjection() {
  projected = [];
  for (const node of nodesById.values()) {
    const p = project(node);
    projected.push({ node, sx: p.sx, sy: p.sy, sr: nodeRadius(node) * p.factor, depth: p.depth, factor: p.factor });
  }
  projected.sort((a, b) => b.depth - a.depth); // far first, near last, so near overlaps far
}

function draw() {
  ctx.fillStyle = bgGradient || getVar('--surface-1');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawStarfield();

  computeProjection();
  const byId = new Map(projected.map(p => [p.node.id, p]));
  const neighbors = focusId ? neighborSet(focusId) : null;
  const now = Date.now();

  // edges
  for (const e of edges) {
    const a = byId.get(e.source), b = byId.get(e.target);
    if (!a || !b) continue;
    const dimmed = (neighbors && !(neighbors.has(e.source) && neighbors.has(e.target)) &&
                   !(e.source === focusId || e.target === focusId)) ||
                   !inFocusedFolder(a.node) || !inFocusedFolder(b.node);

    // activity echo: a touched note's edges brighten (and, for writes,
    // thicken) with the same read/write color language as the node pulses,
    // decaying independently per edge. Decay runs unconditionally so a
    // dimmed edge doesn't "catch up" with a jump once focus changes; the
    // highlight itself is only drawn when not dimmed, same as the node overlays.
    let highlightAlpha = 0, highlightColor = null, highlightWidth = 1;
    const key = edgeKey(e.source, e.target);
    const act = edgeActivity.get(key);
    if (act) {
      const tau = act.action === 'write' ? EDGE_WRITE_TAU_MS : EDGE_READ_TAU_MS;
      const elapsed = now - act.lastUpdate;
      act.intensity *= Math.exp(-elapsed / tau);
      act.lastUpdate = now;
      if (act.intensity < 0.02) {
        edgeActivity.delete(key);
      } else {
        const t = Math.min(1, act.intensity);
        if (act.action === 'write') {
          highlightAlpha = 0.9 * t;
          highlightWidth = 1 + 3 * t;   // up to ~4px — "slightly thicken", per spec
          highlightColor = ACTIVITY_WRITE_COLOR;
        } else {
          highlightAlpha = 0.8 * t;
          highlightWidth = 1 + 1.5 * t; // up to ~2.5px
          highlightColor = ACTIVITY_READ_COLOR;
        }
      }
    }

    if (!dimmed && highlightAlpha > 0) {
      ctx.lineWidth = highlightWidth;
      ctx.globalAlpha = highlightAlpha;
      ctx.strokeStyle = highlightColor;
    } else {
      ctx.lineWidth = 1;
      ctx.globalAlpha = 1;
      ctx.strokeStyle = dimmed ? rgbaText(0.03) :
        (neighbors ? rgbaText(0.35) : GRIDLINE);
    }
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.lineTo(b.sx, b.sy);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  for (const p of projected) {
    const node = p.node;
    const r = p.sr;
    const dimmed = (neighbors && node.id !== focusId && !neighbors.has(node.id)) || !inFocusedFolder(node);
    const color = colorForSlot(node.slot);

    // recency glow: soft halo in whatever reads as "brightest" for the
    // current theme, fades out over 90s
    const age = now - node.mtime;
    if (age >= 0 && age < 90000 && !dimmed) {
      const glowAlpha = 0.35 * (1 - age / 90000);
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r + 6 * p.factor, 0, Math.PI * 2);
      ctx.fillStyle = rgbaText(glowAlpha);
      ctx.fill();
    }

    // activity decay: continuous, wall-clock based, computed unconditionally
    // (even while dimmed) so nothing "catches up" with a jump the moment
    // focus changes elsewhere in the graph
    if (node.readIntensity) {
      const elapsed = now - (node.readLastUpdate || now);
      node.readIntensity *= Math.exp(-elapsed / READ_TAU_MS);
      node.readLastUpdate = now;
      if (node.readIntensity < 0.02) node.readIntensity = 0;
    }
    if (node.writeFlash) {
      const elapsed = now - (node.writeFlashLastUpdate || now);
      node.writeFlash *= Math.exp(-elapsed / WRITE_FLASH_TAU_MS);
      node.writeFlashLastUpdate = now;
      if (node.writeFlash < 0.02) node.writeFlash = 0;
    }
    if (node.writeRings && node.writeRings.length) {
      node.writeRings = node.writeRings.filter(ring => now - ring.start < WRITE_RING_DURATION_MS);
    }

    // write activity: stacked expanding rings, drawn behind the node core so
    // repeated edits read as multiple concentric pulses rather than one reset
    if (!dimmed && node.writeRings && node.writeRings.length) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = ACTIVITY_WRITE_COLOR;
      for (const ring of node.writeRings) {
        const t = (now - ring.start) / WRITE_RING_DURATION_MS; // 0..1
        // r is already screen-space (nodeRadius * p.factor from computeProjection) —
        // only the additive gap/growth need their own p.factor, matching how the
        // existing recency-glow does "r + 6 * p.factor" just above. Fade uses an
        // ease-out (1-t)^2 rather than linear, so the ring stays legible through
        // most of its growth instead of being faintest exactly when it's biggest.
        const ringR = r + (WRITE_RING_START_GAP_PX + WRITE_RING_GROWTH * t) * p.factor;
        ctx.globalAlpha = 0.6 * (1 - t) * (1 - t);
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, ringR, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = dimmed ? 0.15 : 1;
    const glowR = r * 1.7;
    const grad = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, glowR);
    grad.addColorStop(0, TEXT_PRIMARY);
    grad.addColorStop(0.28, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    if (node.id === focusId || node.id === hoverId) {
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = TEXT_PRIMARY;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // read/write activity glow: overlay on top of the node core — read is a
    // subtle cool pulse, write flash is brighter, warmer, and decays faster
    if (!dimmed && node.readIntensity) {
      const readAlpha = 0.75 * Math.min(1, node.readIntensity);
      const readR = Math.max(r * (1.4 + 0.3 * Math.min(1, node.readIntensity)), READ_MIN_PX * p.factor);
      const readGrad = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, readR);
      readGrad.addColorStop(0, ACTIVITY_READ_COLOR);
      readGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = readAlpha;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, readR, 0, Math.PI * 2);
      ctx.fillStyle = readGrad;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (!dimmed && node.writeFlash) {
      const flashAlpha = 0.85 * Math.min(1, node.writeFlash);
      const flashR = Math.max(r * (1.5 + 0.5 * Math.min(1.5, node.writeFlash)), WRITE_FLASH_MIN_PX * p.factor);
      const flashGrad = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, flashR);
      flashGrad.addColorStop(0, TEXT_PRIMARY);
      flashGrad.addColorStop(0.35, ACTIVITY_WRITE_COLOR);
      flashGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = flashAlpha;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, flashR, 0, Math.PI * 2);
      ctx.fillStyle = flashGrad;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // active-note label: transient, independent of the labelsVisible toggle
    // (that toggle only governs the passive hub/focus/hover label below —
    // hiding it shouldn't suppress a label explaining a live event), replaces
    // rather than stacks with that passive label while a note has an active
    // label window. Deliberately decoupled from the node's own readIntensity/
    // writeFlash decay (2026-08-31): those stay fast/energetic, but a label
    // that brief read as a "blink" rather than something legible — so the
    // label instead holds fully readable for LABEL_HOLD_MS, then fades on its
    // own separate LABEL_FADE_MS schedule; see applyActivityToNode() for the
    // hold-refresh and write-precedence rules. Note name prominent with a
    // soft glow; folder beneath it, smaller and muted, reusing the exact
    // hierarchy the tooltip already uses for the same note/folder pairing.
    let labelAlpha = 0;
    if (node.labelExpiresAt) {
      if (now < node.labelExpiresAt) {
        labelAlpha = 1;
      } else {
        const fadeElapsed = now - node.labelExpiresAt;
        if (fadeElapsed < LABEL_FADE_MS) {
          labelAlpha = 1 - fadeElapsed / LABEL_FADE_MS;
        } else {
          node.labelExpiresAt = null;
          node.labelAction = null;
        }
      }
    }
    const isActive = !dimmed && labelAlpha > 0;
    if (isActive) {
      const alpha = labelAlpha;
      const color = node.labelAction === 'write' ? ACTIVITY_WRITE_COLOR : ACTIVITY_READ_COLOR;
      const fontSize = Math.max(8, 12 * p.factor);
      const lx = p.sx + r + 5, ly = p.sy + 4;

      ctx.globalAlpha = alpha;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = color;
      ctx.font = `bold ${fontSize.toFixed(1)}px system-ui, sans-serif`;
      ctx.fillText(node.label, lx, ly);

      ctx.shadowBlur = 0; // subtitle stays crisp, no glow on the secondary line
      ctx.fillStyle = TEXT_MUTED;
      ctx.font = `${(fontSize * 0.82).toFixed(1)}px system-ui, sans-serif`;
      ctx.fillText(node.folder, lx, ly + fontSize * 0.95);

      ctx.globalAlpha = 1;
    } else if (labelsVisible && !dimmed && (node.degree >= 6 || node.id === focusId || node.id === hoverId)) {
      // selective direct labels: only hubs, plus whatever's focused/hovered
      ctx.fillStyle = TEXT_SECONDARY;
      ctx.font = `${Math.max(8, 11 * p.factor).toFixed(1)}px system-ui, sans-serif`;
      ctx.fillText(node.label, p.sx + r + 5, p.sy + 4);
    }
  }
}

function neighborSet(id) {
  const s = new Set();
  for (const e of edges) {
    if (e.source === id) s.add(e.target);
    if (e.target === id) s.add(e.source);
  }
  return s;
}

function nodeAt(screenX, screenY) {
  let closest = null, closestDist = Infinity;
  for (const p of projected) {
    const dx = p.sx - screenX, dy = p.sy - screenY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const r = p.sr + 4;
    if (dist < r && dist < closestDist) {
      closest = p.node; closestDist = dist;
    }
  }
  return closest;
}

// ---- orbit (drag empty space rotates the whole system around the fixed anchor) + zoom (wheel dollies) ----
let isOrbiting = false;
let orbitDragDistance = 0;
let orbitStartClient = { x: 0, y: 0 };
let orbitStartCamera = { yaw: 0, pitch: 0 };

canvas.addEventListener('mousedown', (e) => {
  if (nodeAt(e.offsetX, e.offsetY)) return; // let click handle focus toggling on a node
  folderTracking = false; // manual orbit takes over from wherever tracking currently is
  isOrbiting = true;
  orbitDragDistance = 0;
  orbitStartClient = { x: e.clientX, y: e.clientY };
  orbitStartCamera = { yaw: camera.yaw, pitch: camera.pitch };
  canvas.style.cursor = 'grabbing';
  tooltip.style.display = 'none';
});

window.addEventListener('mousemove', (e) => {
  if (!isOrbiting) return;
  const dx = e.clientX - orbitStartClient.x, dy = e.clientY - orbitStartClient.y;
  orbitDragDistance = Math.max(orbitDragDistance, Math.hypot(dx, dy));
  camera.yaw = orbitStartCamera.yaw - dx * 0.006;
  camera.pitch = Math.min(1.4, Math.max(-1.4, orbitStartCamera.pitch + dy * 0.006));
});

window.addEventListener('mouseup', () => {
  if (isOrbiting) canvas.style.cursor = 'grab';
  isOrbiting = false;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  folderTracking = false; // manual zoom takes over from wherever tracking currently is
  const factor = Math.exp(-e.deltaY * 0.001);
  camera.dist = Math.min(1600, Math.max(120, camera.dist / factor));
}, { passive: false });

canvas.addEventListener('mousemove', (e) => {
  if (isOrbiting) { tooltip.style.display = 'none'; return; }
  const node = nodeAt(e.offsetX, e.offsetY);
  hoverId = node ? node.id : null;
  if (node) {
    const ago = timeAgo(Date.now() - node.mtime);
    tooltip.innerHTML = `<div>${node.label}</div><div class="folder">${node.folder} · edited ${ago}</div>`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('click', (e) => {
  if (orbitDragDistance > 5) { orbitDragDistance = 0; return; }
  const node = nodeAt(e.offsetX, e.offsetY);
  focusId = node ? (node.id === focusId ? null : node.id) : null;
});

function timeAgo(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function loop() {
  step();
  updateFolderTracking();
  draw();
  updateLegendGlow();
  requestAnimationFrame(loop);
}

poll();
pollActivity();
loop();
</script>
</body>
</html>
